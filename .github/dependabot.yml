version: 2
updates:
  - package-ecosystem: nuget
    directory: "/LanDrop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      reviewed-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      reviewed-updates:
        patterns: ["*"]
