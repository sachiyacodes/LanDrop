name: Build and regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build LanDrop/LanDrop.csproj -c Release
      - run: dotnet run --project tests/LanDrop.Checks/LanDrop.Checks.csproj -c Release
      - run: ./scripts/package-release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: LanDrop-win-x64-${{ github.sha }}
          path: |
            artifacts/${{ github.sha }}/*.zip
            artifacts/${{ github.sha }}/SHA256SUMS.txt
          if-no-files-found: error
