name: Build and regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build LanDrop/LanDrop.csproj -c Release
      - run: dotnet run --project tests/LanDrop.Checks/LanDrop.Checks.csproj -c Release
